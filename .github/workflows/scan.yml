name: 4H Crypto Scanner

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bot dosyasını kontrol et
        run: |
          echo "Bot dosyası kontrol ediliyor..."
          ls -la
          test -f bot.py
          echo "bot.py bulundu."

      - name: Binance bağlantısını test et
        run: |
          python -c "import requests; r=requests.get('https://data-api.binance.vision/api/v3/klines', params={'symbol':'BTCUSDT','interval':'4h','limit':3}, timeout=15); print('BINANCE HTTP:', r.status_code); r.raise_for_status()"

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_SYMBOLS: "100"
          MIN_SCORE: "4"
          VOLUME_MULTIPLIER: "1.50"
        run: |
          echo "================================"
          echo "4H KRIPTO BOT BASLIYOR"
          echo "================================"
          python -u bot.py
